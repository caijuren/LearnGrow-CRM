# LearnGrow CRM Nginx 反向代理配置（配置域名和证书后启用）
# 小程序正式版必须使用 HTTPS，HTTP 仅用于证书签发时的校验和跳转。
# 使用方法：
# 1. 将此文件复制到 /etc/nginx/sites-available/learngrow-crm
# 2. 确认 dy/tangma 两个域名都解析到本服务器，并将证书路径替换为实际路径
# 3. 创建软链接: ln -s /etc/nginx/sites-available/learngrow-crm /etc/nginx/sites-enabled/
# 4. 测试配置: nginx -t
# 5. 重启 Nginx: systemctl restart nginx

server {
    listen 80;
    server_name dy.quxueban.cn tangma.quxueban.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dy.quxueban.cn tangma.quxueban.cn;

    ssl_certificate /etc/letsencrypt/live/tangma.quxueban.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangma.quxueban.cn/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/learngrow-crm-access.log;
    error_log /var/log/nginx/learngrow-crm-error.log;
}
