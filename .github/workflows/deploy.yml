name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  NODE_ENV: production
  DATA_DIR: ${{ vars.DATA_DIR || './data' }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/learngrow-crm' }}

jobs:
  test:
    name: Run Tests & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=dev
      
      - name: TypeScript type check
        run: npm run check
      
      - name: Create data directory for test database
        run: mkdir -p ./data
      
      - name: Run database migrations for tests
        run: npx drizzle-kit migrate --config=drizzle.config.ts
      
      - name: Run tests (unit tests only)
        run: ./node_modules/.bin/vitest run tests/unit/
        env:
          JWT_SECRET: test-secret-key-for-ci-cd-pipeline-must-be-at-least-32-chars-long
          NODE_ENV: test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --include=dev
      
      - name: Build frontend
        run: npm run build
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.220.103.120 >> ~/.ssh/known_hosts
      
      - name: Deploy via SSH
        run: |
          DEPLOY_ENV="${{ github.event.inputs.environment || 'production' }}"
          DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/home/ubuntu/learngrow-crm' }}"
          RELEASE_DIR="$DEPLOY_DIR/releases/$(git rev-parse --short HEAD)_$(date +%Y%m%d_%H%M%S)"
          
          # Create release directory on server
          ssh ubuntu@124.220.103.120 "mkdir -p $RELEASE_DIR"
          
          # Upload built files
          tar czf /tmp/deploy.tar.gz --exclude='node_modules' --exclude='.git' --exclude='data' --exclude='.env*' --exclude='tests' .
          scp /tmp/deploy.tar.gz ubuntu@124.220.103.120:$RELEASE_DIR/
          
          # Extract and install on server
          ssh ubuntu@124.220.103.120 "
            cd $RELEASE_DIR && tar xzf deploy.tar.gz && rm deploy.tar.gz
            npm ci --omit=dev
          "
          
          # Copy env file
          if [ "$DEPLOY_ENV" = "staging" ]; then
            ssh ubuntu@124.220.103.120 "cp $DEPLOY_DIR/.env.staging $RELEASE_DIR/.env.production 2>/dev/null || true"
          else
            ssh ubuntu@124.220.103.120 "cp $DEPLOY_DIR/.env.production $RELEASE_DIR/.env.production 2>/dev/null || true"
          fi
          
          # Atomic switch
          ssh ubuntu@124.220.103.120 "
            cd $DEPLOY_DIR
            ln -sfn $RELEASE_DIR current
            rm -f latest
            ln -sfn $RELEASE_DIR latest
          "
          
          # Reload PM2
          ssh ubuntu@124.220.103.120 "cd $DEPLOY_DIR/current && pm2 reload ecosystem.config.cjs --env production || pm2 start ecosystem.config.cjs --env production"
          
          # Health check
          sleep 10
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if ssh ubuntu@124.220.103.120 "curl -sf http://localhost:3456/api/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1
      
      - name: Send success notification
        if: success()
        run: |
          curl -X POST "${{ secrets.WECHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"✅ **部署成功**\n\n**环境**: ${{ github.event.inputs.environment || 'production' }}\n**版本**: $(git rev-parse --short HEAD)\n**提交**: ${GITHUB_SHA}\n**时间**: $(date '+%Y-%m-%d %H:%M:%S')\"
              }
            }"
      
      - name: Send failure notification
        if: failure()
        run: |
          curl -X POST "${{ secrets.WECHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"❌ **部署失败**\n\n**环境**: ${{ github.event.inputs.environment || 'production' }}\n**版本**: $(git rev-parse --short HEAD)\n**提交**: ${GITHUB_SHA}\n**时间**: $(date '+%Y-%m-%d %H:%M:%S')\n\n请检查 GitHub Actions 日志\"
              }
            }"
      
      - name: Auto rollback on failure
        if: failure()
        run: |
          DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/home/ubuntu/learngrow-crm' }}"
          ssh ubuntu@124.220.103.120 "
            PREV=\$(ls -t $DEPLOY_DIR/releases/ | grep -v '\$(git rev-parse --short HEAD)' | head -n 1)
            if [ -n \"\$PREV\" ]; then
              cd $DEPLOY_DIR && ln -sfn releases/\$PREV current
              cd current && pm2 reload ecosystem.config.cjs --env production || pm2 restart all
              echo \"Rolled back to: \$PREV\"
            else
              echo \"No previous release for rollback\"
            fi
          "

  cleanup:
    name: Cleanup Old Releases
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 124.220.103.120 >> ~/.ssh/known_hosts
      
      - name: Remove old releases (keep last 3)
        run: |
          DEPLOY_DIR="${{ vars.DEPLOY_DIR || '/home/ubuntu/learngrow-crm' }}"
          ssh ubuntu@124.220.103.120 "
            cd $DEPLOY_DIR/releases && ls -t | tail -n +4 | xargs -r rm -rf
            echo 'Old releases cleaned up, keeping last 3 versions'
          "
